[package]
name = "mp_denco"
version = "0.1.0"
edition = "2024"
description = "A minimal MessagePack format built on abs_denco."

[dependencies]
abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[dev-dependencies]
anylr = { git = "https://gitee.com/lino_snsalias/anylr.rs.git", branch = "dev/0.2.0" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco", features = [
    "alloc-collections",
    "rc",
    "cow",
    "std",
] }
buffex = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
buffex_tokio_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
cantok_rs = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
denco_macro = { path = "../denco_macro" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_bytes = "0.11.19"
# 仅用于在写错误测试里给客户端套接字设置 `SO_LINGER=0`，让对端收到 RST。
socket2 = "0.6"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }
