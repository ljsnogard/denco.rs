[package]
name = "denco_bumpalo"
version = "0.1.0"
edition = "2024"
description = "bumpalo-backed arena implementations for abs_denco."
license.workspace = true

[dependencies]
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco" }
atomic_sync = { git = "https://gitee.com/lino_snsalias/abs_sync.rs.git" }
bumpalo = "3.20.3"
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[dev-dependencies]
abs_denco = { path = "../abs_denco", features = [
    "alloc-collections",
    "rc",
    "cow",
    "std",
] }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
denco_macro = { path = "../denco_macro" }
mp_denco = { path = "../mp_denco" }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
