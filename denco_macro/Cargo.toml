[package]
name = "denco_macro"
version = "0.1.0"
edition = "2024"
description = "Derive macros for the denco framework."

[lib]
proc-macro = true

[dependencies]
zyn = "0.5.4"

[dev-dependencies]
abs_buff = { path = "../../buffex.rs/abs_buff" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
mp_denco = { path = "../mp_denco" }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
