[package]
name = "denco_macro"
version = "0.1.0"
edition = "2024"
description = "Derive macros for the denco framework."
license.workspace = true

[lib]
proc-macro = true

[features]
# 让 `TrEncodable` 的 derive 额外生成 `impl TrHasTypeId`。必须与
# `abs_denco/type-id` 同时开启。
type-id = []

[dependencies]
zyn = "0.5.4"

[dev-dependencies]
abs_buff = { path = "../../buffex.rs/abs_buff" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco", features = ["type-id"] }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
mp_denco = { path = "../mp_denco" }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
