[package]
name = "json_denco"
version = "0.1.0"
edition = "2024"
description = "A streaming JSON format built on abs_denco and abs_buff."

[dependencies]
abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { path = "../abs_denco" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[dev-dependencies]
abs_denco = { path = "../abs_denco" }
async-net = "2.0.*"
buffex_compio_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
buffex_smol_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
buffex_tokio_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
cantok_rs = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
denco_macro = { path = "../denco_macro" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

compio = { version = "0.19.*", features = ["macros", "net", "runtime", "time"] }
futures-lite = "2.6.*"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.*"
smol = "2.0.*"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }
